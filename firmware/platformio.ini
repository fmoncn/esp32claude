; M5Stack Cardputer ADV (StampS3, ESP32-S3FN8, 8MB flash, 无 PSRAM) —— AI 电子宠物固件
[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 1500000

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2

board_build.flash_size = 8MB
; 自定义分区:factory(app) + spiffs(LittleFS 存精灵包);见 partitions.csv
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

; TODO: 首次构建成功后,把 M5Cardputer 换成你实际验证过的精确版本
; (pio pkg list 里能看到),避免上游发新版后 BMI270/触摸手势静默失效。
lib_deps =
    m5stack/M5Cardputer@^1.0.0
    bblanchon/ArduinoJson@^7
    ; ESP32-audioI2S v3.0.12 已手动放入 .pio/libdeps/cardputer/ESP32-audioI2S (Mac 访问 GitHub 超时)
